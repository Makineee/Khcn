<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robot Assembly Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070b17;--panel:#0f1830;--line:#243558;--tx:#e6f0ff;--mut:#8aa0c8;--a:#22e6ff;--b:#ff8a3d;--ok:#3dff9a;--bad:#ff4d6d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 50% -10%,#142450,var(--bg) 60%) fixed;color:var(--tx);font-family:Orbitron,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:clamp(20px,4vw,34px);margin:6px 0;letter-spacing:2px;text-align:center}
.center{text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
button{font-family:inherit;cursor:pointer;color:var(--tx)}
.btn{background:linear-gradient(90deg,var(--a),#6a7bff);border:0;border-radius:10px;padding:12px 26px;font-weight:800;font-size:16px;color:#021}
input{font-family:inherit;background:#0a1226;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px;font-size:16px;width:100%}
.hud{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}
.score{flex:1;text-align:center;border-radius:12px;padding:8px;border:2px solid var(--line);background:var(--panel);transition:.3s}
.score b{font-size:26px;display:block}
.score.on{box-shadow:0 0 22px currentColor;border-color:currentColor}
.banner{text-align:center;color:var(--mut);font-size:13px;margin-bottom:10px}
.teams{display:block;max-width:560px;margin:0 auto}
@media(max-width:700px){.teams{grid-template-columns:1fr}}
.team{border-radius:14px;border:1px solid var(--line);padding:10px;background:var(--panel);opacity:.55;transition:.3s}
.team.on{opacity:1}
.team h2{margin:0 0 6px;font-size:16px;text-align:center}
.robots{display:grid;grid-template-columns:1fr;gap:6px;max-width:480px;margin:0 auto}
.robots svg{width:100%;height:auto;max-height:68vh}
.robots svg{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rn{font-size:11px;color:var(--mut);text-align:center}
.gh{fill:rgba(255,255,255,.04);stroke-width:2;stroke-dasharray:6 5;opacity:.45}
.slot.act{cursor:pointer}.slot.act .gh{opacity:1;animation:pl 1.2s infinite}.slot.act:hover .gh{fill:rgba(255,255,255,.18)}
.slot text{fill:#fff;font-size:20px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
@keyframes pl{50%{opacity:.4}}
.drop{animation:drop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
.boxin{animation:boxin .4s .8s both}
@keyframes boxin{from{opacity:0;transform:scale(.4)}}
.burst{transform-box:fill-box;transform-origin:center;animation:bst .9s ease-out both}
@keyframes bst{0%{transform:scale(.2);opacity:1}100%{transform:scale(3);opacity:0}}
.flash{animation:fl .9s both}
@keyframes fl{0%,40%{opacity:1}100%{opacity:0}}
.ov{position:fixed;inset:0;background:rgba(3,6,15,.82);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10;overflow:auto}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,34px);max-width:1040px;width:100%;font-size:clamp(18px,2.4vw,28px)}
.picks{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(8px,1.6vw,20px);margin-top:18px}
@media(max-width:560px){.picks{grid-template-columns:repeat(3,1fr)}}
.pk{background:#0a1226;border:2px solid var(--line);border-radius:10px;padding:6px;font-size:12px}
.pk:hover{border-color:var(--c)}.pk svg{width:100%;height:clamp(110px,24vh,210px)}
.q{font-size:clamp(22px,3.8vw,42px);line-height:1.35;margin:10px 0 22px;font-weight:500}
.opt{display:block;width:100%;text-align:left;background:#0a1226;border:2px solid var(--line);border-radius:14px;padding:clamp(12px,2vw,22px);margin-bottom:12px;font-size:clamp(18px,2.7vw,30px)}
.opt:hover{border-color:var(--a)}
.opt.ok{background:#0d4a2d;border-color:var(--ok)}.opt.no{background:#5a1526;border-color:var(--bad)}
.res{font-size:22px;font-weight:800;margin:8px 0}
.mut{color:var(--mut);font-size:13px}.bar{height:8px;background:#0a1226;border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width 1s linear,background .3s}.hp{height:10px;background:#0a1226;border-radius:6px;overflow:hidden;margin:4px 0}.hp i{display:block;height:100%;transition:width .8s}.arena{display:flex;justify-content:space-around;align-items:flex-end;margin:6px 0 10px}.vs{font-size:28px;font-weight:800;color:var(--mut);align-self:center}.fig{position:relative;width:clamp(130px,min(26vw,30vh),380px);transition:transform .25s}.fig svg{width:100%;height:auto;animation:bob 2.2s ease-in-out infinite}
.arena{position:relative}
.f0.pn{animation:pn0 1.6s .9s both}.f1.pn{animation:pn1 1.6s .9s both}
@keyframes pn0{0%,100%{transform:none}30%{transform:translateX(-14%) scale(.92)}50%,65%{transform:translateX(70%) scale(1.25)}}
@keyframes pn1{0%,100%{transform:none}30%{transform:translateX(14%) scale(.92)}50%,65%{transform:translateX(-70%) scale(1.25)}}
.f0.kk{animation:kk0 1.8s .9s both}.f1.kk{animation:kk1 1.8s .9s both}
@keyframes kk0{0%,100%{transform:none}30%{transform:translateX(-12%) rotate(12deg)}55%,70%{transform:translateX(70%) rotate(-32deg) scale(1.2)}}
@keyframes kk1{0%,100%{transform:none}30%{transform:translateX(12%) rotate(-12deg)}55%,70%{transform:translateX(-70%) rotate(32deg) scale(1.2)}}
.fig.jmp{animation:jmp 1.8s .9s both}
@keyframes jmp{0%,100%{transform:none}15%{transform:scale(1.15,.8)}45%{transform:translateY(-140px) scale(.95,1.15)}75%{transform:translateY(-140px) rotate(360deg)}90%{transform:scale(1.15,.85)}}
.fig.gd{animation:gdd 1.6s .9s both}
@keyframes gdd{0%,100%{transform:none;filter:none}25%,70%{transform:scale(1.2);filter:drop-shadow(0 0 30px #5cf) brightness(1.3)}}
.f0.sp{animation:sp0 2.4s .9s both}.f1.sp{animation:sp1 2.4s .9s both}
@keyframes sp0{0%,100%{transform:none;filter:none}10%{transform:scale(1.15) rotate(-4deg);filter:drop-shadow(0 0 30px #ffe14d) brightness(1.4)}20%{transform:scale(1.22) rotate(4deg)}30%{transform:scale(1.28) rotate(-4deg)}40%{transform:scale(1.3) rotate(4deg)}65%,75%{transform:translateX(75%) scale(1.35);filter:drop-shadow(0 0 45px #ffe14d) brightness(1.6)}}
@keyframes sp1{0%,100%{transform:none;filter:none}10%{transform:scale(1.15) rotate(4deg);filter:drop-shadow(0 0 30px #ffe14d) brightness(1.4)}20%{transform:scale(1.22) rotate(-4deg)}30%{transform:scale(1.28) rotate(4deg)}40%{transform:scale(1.3) rotate(-4deg)}65%,75%{transform:translateX(-75%) scale(1.35);filter:drop-shadow(0 0 45px #ffe14d) brightness(1.6)}}
.fig.fail{animation:wob 1.8s .9s both}
@keyframes wob{0%,100%{transform:none;opacity:1}20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-6deg) translateY(10px);opacity:.6}80%{opacity:.6}}
.fig.hurt svg{animation:shake 1.2s var(--t) both}
@keyframes shake{0%{transform:none;filter:drop-shadow(0 0 24px #f33) brightness(2.2)}15%{transform:translateX(-28px) rotate(-10deg)}35%{transform:translateX(24px) rotate(9deg)}55%{transform:translateX(-16px) rotate(-5deg)}75%{transform:translateX(10px)}100%{transform:none;filter:none}}
.fig .dmg{font-size:52px;font-weight:800;animation:up2 2s var(--t) both}
@keyframes up2{0%{opacity:0;transform:translate(-50%,0) scale(.3)}10%{opacity:1;transform:translate(-50%,-10px) scale(1.5)}25%{transform:translate(-50%,-25px) scale(1)}100%{opacity:0;transform:translate(-50%,-100px)}}
.fx{position:absolute;top:30%;left:50%;z-index:3;font-size:48px;font-weight:800;white-space:nowrap;text-shadow:4px 4px 0 #000,-3px -3px 0 #000;animation:fxp 1.8s var(--t) both;pointer-events:none}
.fx::before{content:'✸';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:150px;opacity:.5;z-index:-1}
@keyframes fxp{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.7) rotate(8deg);opacity:1}70%{transform:translate(-50%,-55%) scale(1.2) rotate(-3deg);opacity:1}100%{transform:translate(-50%,-80%) scale(1.1);opacity:0}}
.pt{position:absolute;left:50%;top:40%;font-style:normal;font-size:30px;color:#ffe14d;z-index:3;animation:pt 1.2s var(--t) both}
@keyframes pt{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.8) rotate(180deg)}}
.arena.big{animation:ash .9s var(--t)}
@keyframes ash{10%{left:-14px;top:6px}30%{left:12px;top:-6px}50%{left:-10px;top:4px}70%{left:8px;top:-3px}100%{left:0;top:0}}
.arena.big::after{content:'';position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;animation:flsh .8s var(--t) both}
.arena.spl::after{background:#ffe14d}
@keyframes flsh{0%{opacity:0}12%{opacity:.8}100%{opacity:0}}
.fig.ko{animation:ko 1.8s calc(var(--t) + .4s) both}
@keyframes ko{0%{transform:none}100%{transform:rotate(80deg) translateY(50px);opacity:.75}}
.win-ov{flex-direction:column;background:radial-gradient(circle,#2a1a5e,#070b17);overflow:hidden}
.cf{position:fixed;top:-30px;z-index:1;border-radius:2px;animation:cfall linear infinite}
@keyframes cfall{to{transform:translateY(110vh) rotate(720deg)}}
.ro{position:fixed;bottom:-50px;font-size:36px;z-index:1;animation:rise 4.5s linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(30deg)}}
.rb{font-size:clamp(26px,6vw,56px);margin:4px 0 10px;background:linear-gradient(90deg,#ff4d6d,#ffe14d,#3dff9a,#22e6ff,#c77dff,#ff4d6d);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rbm 2s linear infinite,pls 1s ease-in-out infinite}
@keyframes rbm{to{background-position:300% 0}}@keyframes pls{50%{transform:scale(1.08)}}
.stage{display:flex;justify-content:center;gap:20px}
.win{position:relative;width:min(55vw,340px);filter:drop-shadow(0 0 30px #ffe14d);animation:zin .9s cubic-bezier(.2,1.5,.4,1) both,dance 1s .9s ease-in-out infinite}
.win.sm{width:min(38vw,230px);filter:none}.win svg{width:100%;height:auto;display:block}
@keyframes zin{from{transform:scale(0) rotate(-180deg);opacity:0}}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-5deg)}25%{transform:translateY(-30px) rotate(5deg) scale(1.05)}50%{transform:translateY(0) rotate(-5deg)}75%{transform:translateY(-30px) rotate(5deg) scale(1.05)}}
.crown{position:absolute;top:-26px;left:50%;font-size:56px;z-index:2;transform:translateX(-50%);animation:crw 1s ease-in-out infinite}
@keyframes crw{50%{transform:translateX(-50%) translateY(-8px) rotate(10deg)}}
.how{max-width:780px;margin:0 auto}.how h1{font-size:clamp(18px,4vw,28px)}
.hw{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0}
.th{width:72px;height:84px;background:#0a1226;border:2px solid var(--line);border-radius:10px}
.arr{font-size:28px;color:var(--mut)}
.ac{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;text-align:left}
.ac div{background:#0a1226;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px}.ac b{font-size:16px}
.logo{font-size:clamp(26px,7vw,62px);margin:6px 0;text-shadow:0 0 24px #22e6ff}
.bobs svg{width:100%;height:auto;animation:bob 2.2s ease-in-out infinite}
body{padding-bottom:44px}.np{position:fixed;left:8px;right:8px;bottom:calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center;font-size:10px;color:var(--mut);z-index:20;pointer-events:none;text-align:center}.np button{pointer-events:auto;width:auto;padding:4px 8px;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.menu{position:relative;overflow:hidden;min-height:calc(100vh - 70px);border-radius:16px;background:radial-gradient(circle at 50% 35%,#2b1b70,#0a1030 55%,#070b17);border:1px solid var(--line)}
.mc{position:relative;z-index:2;text-align:center;padding:3vh 10px}
.gridf{position:absolute;left:-50%;right:-50%;bottom:0;height:45%;background-image:linear-gradient(#22e6ff66 2px,transparent 2px),linear-gradient(90deg,#22e6ff66 2px,transparent 2px);background-size:60px 60px;transform:perspective(300px) rotateX(62deg);transform-origin:bottom;animation:gm 1.2s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
@keyframes gm{to{background-position:0 60px}}
.fl{position:absolute;bottom:-50px;opacity:.45;font-style:normal;animation:rise2 linear infinite;z-index:1}
@keyframes rise2{to{transform:translateY(-125vh) rotate(360deg)}}
.chip{display:inline-block;border:1px solid #22e6ff;color:#22e6ff;border-radius:20px;padding:4px 14px;font-size:11px;letter-spacing:2px;background:#22e6ff18;margin-bottom:8px}
.gl{position:relative;display:block;margin:0;font-size:clamp(38px,10vw,100px);font-weight:800;line-height:1;color:#fff;text-shadow:0 0 18px #22e6ff,0 0 48px #22e6ff;letter-spacing:4px;animation:tin .8s cubic-bezier(.2,1.6,.4,1) both}
.gl2{font-size:clamp(24px,6.5vw,62px);color:#ffd9b0;text-shadow:0 0 18px #ff8a3d,0 0 48px #ff8a3d;animation-delay:.25s}
.gl::before,.gl::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden;text-shadow:none}
.gl::before{color:#ff4d6d;clip-path:inset(0 0 60% 0);animation:g1 2.6s infinite steps(1)}
.gl::after{color:#22e6ff;clip-path:inset(60% 0 0 0);animation:g2 3.1s infinite steps(1)}
@keyframes g1{0%,88%{transform:translate(0)}90%{transform:translate(-6px,2px)}94%{transform:translate(5px,-2px)}100%{transform:translate(0)}}
@keyframes g2{0%,80%{transform:translate(0)}83%{transform:translate(6px,-2px)}88%{transform:translate(-5px,2px)}100%{transform:translate(0)}}
@keyframes tin{from{transform:translateY(-80px) scale(.5);opacity:0}}
.arenam{display:flex;justify-content:center;align-items:center;gap:2vw;margin:8px 0}
.mr{width:min(32vw,250px)}.mL{--g:#22e6ff;animation:lgL 3s ease-in-out infinite}.mR{--g:#ff8a3d;animation:lgR 3s 1.5s ease-in-out infinite}
.mr svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 22px var(--g))}
@keyframes lgL{0%,100%{transform:none}10%{transform:translateX(-8%) scale(.96)}18%{transform:translateX(26%) scale(1.1) rotate(4deg)}30%{transform:none}55%{transform:translateY(-12px)}75%{transform:none}}
@keyframes lgR{0%,100%{transform:none}10%{transform:translateX(8%) scale(.96)}18%{transform:translateX(-26%) scale(1.1) rotate(-4deg)}30%{transform:none}55%{transform:translateY(-12px)}75%{transform:none}}
.vsx{font-size:clamp(34px,8vw,72px);font-weight:800;color:#ffe14d;text-shadow:3px 3px 0 #ff4d6d,0 0 30px #ffe14d;animation:vsp 1s ease-in-out infinite}
@keyframes vsp{0%,100%{transform:scale(1) rotate(-6deg)}50%{transform:scale(1.25) rotate(6deg)}}
.steps{display:flex;gap:10px;justify-content:center;align-items:center;margin:12px 0 18px;flex-wrap:wrap}
.steps span{background:#0f1830cc;border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px;animation:stp .7s both}
.steps span:nth-child(3){animation-delay:.25s}.steps span:nth-child(5){animation-delay:.5s}.steps b{color:#ffe14d}
@keyframes stp{from{transform:translateY(20px) scale(.6);opacity:0}}
.go{font-family:inherit;font-size:clamp(22px,4vw,32px);font-weight:800;color:#021;border:0;border-radius:16px;padding:18px 60px;background:linear-gradient(90deg,#22e6ff,#7a8bff,#ff6fb5,#22e6ff);background-size:300% 100%;animation:gbg 3s linear infinite,gpl 1.4s ease-in-out infinite;box-shadow:0 0 30px #22e6ff99;position:relative;overflow:hidden;cursor:pointer}
.go::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:rgba(255,255,255,.55);transform:skewX(-20deg);animation:shn 2.5s infinite}
@keyframes gbg{to{background-position:300% 0}}@keyframes gpl{50%{transform:scale(1.07)}}@keyframes shn{to{left:140%}}
.go:hover{filter:brightness(1.15)}
.hwb{margin-top:16px;font-family:inherit;background:transparent;border:2px solid #ffe14d;color:#ffe14d;border-radius:12px;padding:10px 26px;font-size:15px;cursor:pointer;text-shadow:0 0 8px #ffe14d}.hwb:hover{background:#ffe14d22}
/* ===== ARENA ===== */
.bt .hud{align-items:center;gap:clamp(6px,1.4vw,18px);margin-bottom:6px}
.plate{flex:1;background:linear-gradient(#0f1830,#0a1226);border:3px solid var(--c);border-radius:14px;padding:8px 12px;box-shadow:0 0 18px var(--c)}
.pn{font-weight:800;font-size:clamp(16px,2.6vw,30px);color:var(--c);text-shadow:0 0 10px var(--c)}
.hpb{position:relative;height:clamp(22px,3.4vw,38px);background:#05080f;border-radius:8px;overflow:hidden;border:2px solid #000;margin-top:4px}
.hpb u,.hpb i{position:absolute;left:0;top:0;height:100%;width:var(--b)}
.hpb u{background:#fff;animation:trail 1.3s calc(var(--t) + .25s) both}.hpb i{animation:hpd .45s var(--t) both}
.hpb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.9vw,22px);font-weight:800;color:#fff;text-shadow:1px 1px 0 #000,0 0 6px #000;z-index:2}
@keyframes hpd{from{width:var(--a)}to{width:var(--b)}}@keyframes trail{from{width:var(--a)}to{width:var(--b)}}
.rdb{flex:none;width:clamp(70px,10vw,120px);text-align:center;font-size:clamp(10px,1.4vw,15px);color:var(--mut);letter-spacing:2px}
.rdb b{display:block;font-size:clamp(30px,5vw,60px);color:#ffe14d;text-shadow:0 0 14px #ffe14d;line-height:1}.rdb small{font-size:.9em}
.arena{position:relative;min-height:clamp(280px,50vh,580px);border-radius:18px;overflow:hidden;margin:8px 0 10px;display:flex;justify-content:space-around;align-items:flex-end;padding:0 3% 2.5%;background:linear-gradient(#0b0f2a,#1a1050 55%,#070b17);border:3px solid #3a4f86;box-shadow:inset 0 0 70px #000,0 0 26px #6a3cff66}
.bk{position:absolute;inset:0;z-index:0}
.beam{position:absolute;top:-25%;width:32%;height:150%;background:linear-gradient(rgba(255,255,255,.24),transparent 70%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);transform-origin:50% 0;animation:swing 4s ease-in-out infinite alternate}
.b1{left:8%}.b2{right:8%;animation-delay:-2s}
@keyframes swing{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.cr{position:absolute;top:5%;left:0;right:0;display:flex;justify-content:space-around;font-size:clamp(20px,3.4vw,46px);opacity:.75}
.cr i{font-style:normal;animation:cb 1.2s ease-in-out infinite}
@keyframes cb{50%{transform:translateY(-10px)}}
.arena.big .cr i{animation:cheer .5s var(--t) 3}
@keyframes cheer{50%{transform:translateY(-38px) scale(1.35)}}
.flr{position:absolute;left:-30%;right:-30%;bottom:0;height:48%;background-image:linear-gradient(#22e6ff55 2px,transparent 2px),linear-gradient(90deg,#22e6ff55 2px,transparent 2px),radial-gradient(ellipse at 50% 0,#6a3cff66,transparent 70%);background-size:70px 70px,70px 70px,100% 100%;transform:perspective(380px) rotateX(64deg);transform-origin:bottom;animation:fm 3s linear infinite;z-index:0}
@keyframes fm{to{background-position:0 70px,0 70px,0 0}}
.arena .fig{z-index:2}.arena .emo{top:0;font-size:clamp(40px,6vw,76px);z-index:4}
.f0{--tc:#22e6ff}.f1{--tc:#ff8a3d}
.fig::before{content:'';position:absolute;left:0;right:0;bottom:0;height:14%;border-radius:50%;background:radial-gradient(var(--tc),transparent 70%);opacity:.85}
.arena .vs{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-size:clamp(44px,9vw,130px);color:#ffe14d;opacity:.22;text-shadow:0 0 30px #ff4d6d;z-index:1;animation:none}

bgmOff(1);fanfare();setTimeout(()=>{if(B)bgmOn(3)},1300);
const cf=Array.from({length:70},()=>`<i class='cf' style='left:${Math.random()*100}%;background:hsl(${Math.random()*360},90%,60%);width:${6+Math.random()*8}px;height:${10+Math.random()*12}px;animation-duration:${2.5+Math.random()*3}s;animation-delay:${Math.random()*3}s'></i>`).join('');
const em=Array.from({length:14},(_,i)=>`<b class='ro' style='left:${3+i*7}%;animation-delay:${i*.35}s'>${['🎉','🎊','✨','🏆','🎈'][i%5]}</b>`).join('');
const fg=t=>`<div class='win ${dr?'sm':''}'>${dr?'':`<div class='crown'>👑</div>`}${robot(t,0,null)}</div>`;
const o=document.createElement('div');o.className='ov win-ov';
o.innerHTML=`${cf}${em}<div class='center' style='position:relative;z-index:2;width:100%'><h1 class='rb'>${dr?'IT’S A DRAW! 🤝':'🏆 '+names[w]+' WINS! 🏆'}</h1><div class='stage'>${dr?fg(0)+fg(1):fg(w)}</div><p class='res'>${names[0]}: ${a} HP · ${names[1]}: ${b} HP</p><button class='btn' id='again'>PLAY AGAIN</button></div>`;
document.body.appendChild(o);
o.querySelector('#again').onclick=()=>{document.querySelectorAll('.ov').forEach(e=>e.remove());bgmOff(3);B=null;HOT=false;hello();setup();};}

let HOT=false,PL=[0,0],ws,lob=0,QZ=null;
function tx(team,msg){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'to',team,msg}));}
function hello(){[0,1].forEach(t=>tx(t,{k:'hello',name:names[t],col:COL[t]}));}
function sendPicks(){if(!B.ph)return;[0,1].forEach(t=>tx(t,{k:'pick',name:names[t],col:COL[t],rd:B.rd,hp:B.hp,acts:Object.keys(AC5).map(a=>({a,i:AC5[a][0],n:AC5[a][1],d:DS[a],c:B.cd[t][a]||0}))}));}
function phAct(t,a){if(!B||!B.ph||B.lock||B.pk[t]||!AC5[a]||(B.cd[t][a]||0)>0)return;B.pk[t]=a;tx(t,{k:'locked'});if(B.pk[0]&&B.pk[1]){B.lock=true;B.msg='⏳ …';bs();bres();}else bs();}
function lobby(){document.querySelectorAll('.ov').forEach(e=>e.remove());lob=1;
const u=t=>location.origin+'/c.html?t='+t,dk=['0a6b7a','b34700'];
const box=t=>`<div class='qb' style='--c:${COL[t]}'><h2>${names[t]}</h2><div class='qi'><img alt='QR' src='https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=0&color=${dk[t]}&data=${encodeURIComponent(u(t))}'></div><div class='qs ${PL[t]?'ok':''}'>${PL[t]?'📱 CONNECTED ✅':'⏳ Waiting for '+names[t]+'…'}</div><small class='mut' style='word-break:break-all'>${u(t)}</small></div>`;
app.innerHTML=`<h1>📱 SCAN YOUR OWN CODE</h1><p class='center mut'>Each team scans <b>only its own</b> code (matching color)</p><div class='qrow'>${box(0)}<div class='qv'>VS</div>${box(1)}</div><p class='center'><button class='btn' id='fg' ${PL[0]&&PL[1]?'':"disabled style='opacity:.4'"}>⚔️ FIGHT!</button></p><p class='center'><button class='pk' id='ht' style='padding:8px 16px'>Skip phones (hotseat)</button></p>`;
$('fg').onclick=()=>{lob=0;HOT=false;battle();};$('ht').onclick=()=>{lob=0;HOT=true;battle();};}
function conn(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
ws.onopen=()=>ws.send(JSON.stringify({type:'host'}));
ws.onclose=()=>{PL=[0,0];setTimeout(conn,1500);};
ws.onmessage=e=>{const m=JSON.parse(e.data);
if(m.type==='players'){PL=m.on;if(lob)lobby();if(!B)hello();}
else if(m.type==='c'&&B){if(m.msg.k==='act')phAct(m.team,m.msg.a);if(m.msg.k==='ans'&&QZ&&QZ.t===m.team)QZ.go(m.msg.i);}};}
conn();
setup();
</script></body></html>
