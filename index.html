<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robot Assembly Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070b17;--panel:#0f1830;--line:#243558;--tx:#e6f0ff;--mut:#8aa0c8;--a:#22e6ff;--b:#ff8a3d;--ok:#3dff9a;--bad:#ff4d6d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 50% -10%,#142450,var(--bg) 60%) fixed;color:var(--tx);font-family:Orbitron,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:clamp(20px,4vw,34px);margin:6px 0;letter-spacing:2px;text-align:center}
.center{text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
button{font-family:inherit;cursor:pointer;color:var(--tx)}
.btn{background:linear-gradient(90deg,var(--a),#6a7bff);border:0;border-radius:10px;padding:12px 26px;font-weight:800;font-size:16px;color:#021}
input{font-family:inherit;background:#0a1226;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px;font-size:16px;width:100%}
.hud{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}
.score{flex:1;text-align:center;border-radius:12px;padding:8px;border:2px solid var(--line);background:var(--panel);transition:.3s}
.score b{font-size:26px;display:block}
.score.on{box-shadow:0 0 22px currentColor;border-color:currentColor}
.banner{text-align:center;color:var(--mut);font-size:13px;margin-bottom:10px}
.teams{display:block;max-width:560px;margin:0 auto}
@media(max-width:700px){.teams{grid-template-columns:1fr}}
.team{border-radius:14px;border:1px solid var(--line);padding:10px;background:var(--panel);opacity:.55;transition:.3s}
.team.on{opacity:1}
.team h2{margin:0 0 6px;font-size:16px;text-align:center}
.robots{display:grid;grid-template-columns:1fr;gap:6px;max-width:480px;margin:0 auto}
.robots svg{width:100%;height:auto;max-height:68vh}
.robots svg{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rn{font-size:11px;color:var(--mut);text-align:center}
.gh{fill:rgba(255,255,255,.04);stroke-width:2;stroke-dasharray:6 5;opacity:.45}
.slot.act{cursor:pointer}.slot.act .gh{opacity:1;animation:pl 1.2s infinite}.slot.act:hover .gh{fill:rgba(255,255,255,.18)}
.slot text{fill:#fff;font-size:20px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
@keyframes pl{50%{opacity:.4}}
.drop{animation:drop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
.boxin{animation:boxin .4s .8s both}
@keyframes boxin{from{opacity:0;transform:scale(.4)}}
.burst{transform-box:fill-box;transform-origin:center;animation:bst .9s ease-out both}
@keyframes bst{0%{transform:scale(.2);opacity:1}100%{transform:scale(3);opacity:0}}
.flash{animation:fl .9s both}
@keyframes fl{0%,40%{opacity:1}100%{opacity:0}}
.ov{position:fixed;inset:0;background:rgba(3,6,15,.82);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10;overflow:auto}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px;max-width:640px;width:100%}
.picks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
@media(max-width:560px){.picks{grid-template-columns:repeat(3,1fr)}}
.pk{background:#0a1226;border:2px solid var(--line);border-radius:10px;padding:6px;font-size:12px}
.pk:hover{border-color:var(--c)}.pk svg{width:100%;height:80px}
.q{font-size:clamp(16px,3vw,21px);line-height:1.4;margin:6px 0 14px;font-weight:500}
.opt{display:block;width:100%;text-align:left;background:#0a1226;border:2px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;font-size:15px}
.opt:hover{border-color:var(--a)}
.opt.ok{background:#0d4a2d;border-color:var(--ok)}.opt.no{background:#5a1526;border-color:var(--bad)}
.res{font-size:22px;font-weight:800;margin:8px 0}
.mut{color:var(--mut);font-size:13px}.bar{height:8px;background:#0a1226;border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width 1s linear,background .3s}.hp{height:10px;background:#0a1226;border-radius:6px;overflow:hidden;margin:4px 0}.hp i{display:block;height:100%;transition:width .8s}.arena{display:flex;justify-content:space-around;align-items:flex-end;margin:6px 0 10px}.vs{font-size:28px;font-weight:800;color:var(--mut);align-self:center}.fig{position:relative;width:40%;max-width:250px;transition:transform .25s}.fig svg{width:100%;height:auto;animation:bob 2.2s ease-in-out infinite}.f0.atk{transform:translateX(35%) scale(1.1)}.f1.atk{transform:translateX(-35%) scale(1.1)}.fig.jmp{transform:translateY(-45px)}.fig.gd{filter:drop-shadow(0 0 14px #5cf)}.fig.sp{filter:drop-shadow(0 0 22px #ffe14d)}.fig.fail{opacity:.6}.fig.hurt{animation:shake .5s;filter:drop-shadow(0 0 14px #f33)}@keyframes shake{25%{margin-left:-12px}75%{margin-left:12px}}.dmg{position:absolute;top:-6px;left:50%;font-size:34px;color:#ff4d6d;z-index:2;animation:up 1.4s both;text-shadow:0 0 8px #000}@keyframes up{from{transform:translate(-50%,0)}to{transform:translate(-50%,-50px);opacity:0}}.emo{position:absolute;top:-30px;left:50%;font-size:44px;z-index:2;animation:pop .6s both}@keyframes pop{from{transform:translateX(-50%) scale(0)}to{transform:translateX(-50%) scale(1)}}.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}@media(max-width:700px){.acts{grid-template-columns:1fr 1fr}}.act{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:13px}.act span{font-size:30px}.act small{color:var(--mut);font-size:10px;text-align:center}.act:hover:not(:disabled){border-color:var(--a)}.act:disabled{opacity:.4;cursor:not-allowed}
</style></head><body>
<div class="wrap" id="app"></div>
<script>
// ====== QUESTION BANK: first answer is the CORRECT one (options are shuffled in game) ======
const QS=[
["Which word means “a machine that can do tasks automatically”?",["Robot","Battery","Screen","Cable"]],
["What does “AI” stand for?",["Artificial Intelligence","Automatic Internet","Advanced Install","Applied Input"]],
["The “brain” of a computer is the ___.",["processor (CPU)","keyboard","speaker","mouse"]],
["Which of these is a renewable energy source?",["Solar power","Coal","Oil","Natural gas"]],
["“Download” means to ___.",["copy data from the internet to your device","send a file to a server","delete a program","turn off a computer"]],
["The opposite of “hardware” is ___.",["software","keyboard","screen","circuit"]],
["A device that stores electrical energy is a ___.",["battery","sensor","router","printer"]],
["Which device detects changes such as heat or light?",["sensor","speaker","cable","folder"]],
["“Virtual reality” lets users ___.",["experience a simulated 3D environment","print 3D objects","repair cables","store passwords"]],
["A 3D printer makes objects by ___.",["adding material layer by layer","cutting paper","recording sound","scanning text"]],
["Wi-Fi is used to ___.",["connect devices to the internet wirelessly","charge phones","cool computers","clean screens"]],
["Programmers write ___ to give instructions to computers.",["code","poems","recipes","slogans"]],
["“Data” means ___.",["facts and information","a type of cable","an electric shock","a screen size"]],
["To protect your account, you should use a strong ___.",["password","wallpaper","font","keyboard"]],
["A self-driving car uses ___ to “see” the road.",["cameras and sensors","wooden wheels","paper maps only","horns"]],
["“Cloud storage” means saving files ___.",["on remote servers via the internet","inside the CPU","on paper","in a USB cable"]],
["Which one is NOT a programming language?",["Chrome","Python","Java","C++"]],
["“Cybersecurity” is about ___.",["protecting computers and data from attacks","building bridges","designing clothes","cooking food"]],
["A “drone” is ___.",["an unmanned flying vehicle","an underwater cable","a software bug","a smart watch"]],
["“Innovation” means ___.",["a new idea or method","an old tool","a broken device","a power cut"]],
["Smartphone touchscreens respond to ___.",["touch","smell","taste","wind"]],
["What is the past tense of “invent”?",["invented","invent","inventing","invents"]],
["“The robot ___ by engineers last year.”",["was built","built","builds","is building"]],
["A search engine is used for ___.",["finding information online","printing photos","charging devices","recording voice"]],
["“Artificial” means ___.",["made by people, not natural","very old","extremely fast","free of charge"]],
["A “bug” in software is ___.",["an error in the code","a small insect robot","a type of battery","a fast connection"]],
["Which technology helps us talk face-to-face over the internet?",["Video call","Fax","Telegram wire","Radio tower"]],
["“Wearable technology” includes ___.",["smart watches","wooden chairs","paper books","glass windows"]]
];
const SL=['head','body','armL','armR','legL','legR'];
const LB={head:'Head',body:'Body',armL:'Left arm',armR:'Right arm',legL:'Left leg',legR:'Right leg'};
const BB={head:[72,6,56,58],body:[64,70,72,100],armL:[40,74,28,94],armR:[40,74,28,94],legL:[66,166,38,90],legR:[66,166,38,90]};
const NM=['Goofy','Wacky','Derpy','Zany','Silly'];
const COL=['#22e6ff','#ff8a3d'];
const O=`stroke="#1a1030" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"`,Y='#ffe14d',P='#ff6fb5',K='#1a1030';
const eye=(x,y,r,px=0,py=0)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${K}" stroke-width="3"/><circle cx="${x+px}" cy="${y+py}" r="${r*.45}" fill="${K}"/>`;
function part(s,v,c){
const f=`fill="${c}" ${O}`,N=`fill="none" ${O}`,T=`stroke-width="3"`;
const S={
head:[
`<path d="M100 20v-10" ${N}/><circle cx="100" cy="9" r="5" fill="${Y}" ${O} ${T}/><rect x="74" y="20" width="52" height="44" rx="14" ${f}/>${eye(90,37,10,2,2)}${eye(112,39,6,-1,1)}<path d="M84 52q7 7 14 0t14 0" ${N} ${T}/><ellipse cx="104" cy="60" rx="5" ry="6" fill="${P}" stroke="${K}" stroke-width="2.5"/>`,
`<circle cx="100" cy="41" r="25" ${f}/>${eye(100,37,15,4,-2)}<rect x="92" y="55" width="8" height="9" fill="#fff" stroke="${K}" stroke-width="2.5"/><rect x="100" y="55" width="8" height="9" fill="#fff" stroke="${K}" stroke-width="2.5"/><path d="M94 17q-4-10-8-8M100 16V6M106 17q4-10 8-8" ${N} ${T}/>`,
`<path d="M76 62V42a24 24 0 0 1 48 0v20z" ${f}/><path d="M100 18v-6M84 12h32" ${N}/>${eye(90,40,8,2,0)}${eye(110,40,8,-2,0)}<path d="M80 54q10-10 20-2q10-8 20 2q-10 8-20 2q-10 6-20-2z" fill="#6b3f1d" ${O} ${T}/>`,
`<rect x="73" y="20" width="54" height="44" rx="6" ${f}/><circle cx="67" cy="42" r="5" fill="${Y}" ${O} ${T}/><circle cx="133" cy="42" r="5" fill="${Y}" ${O} ${T}/>${eye(89,38,8,0,1)}${eye(111,38,8,0,1)}<path d="M80 26l16 6M120 26l-16 6" ${N}/><rect x="82" y="51" width="36" height="10" rx="3" fill="#fff" stroke="${K}" stroke-width="3"/><path d="M91 51v10M100 51v10M109 51v10" stroke="${K}" stroke-width="2"/>`,
`<path d="M88 24l-6-14M112 24l6-14" ${N} ${T}/><circle cx="82" cy="9" r="7" fill="#fff" ${O} ${T}/><circle cx="83" cy="9" r="3" fill="${K}"/><circle cx="118" cy="9" r="7" fill="#fff" ${O} ${T}/><circle cx="117" cy="9" r="3" fill="${K}"/><rect x="74" y="22" width="52" height="42" rx="20" ${f}/>${eye(90,37,6)}${eye(110,37,6)}<path d="M86 48q14 14 28 0" ${N} ${T}/><rect x="97" y="53" width="6" height="7" fill="#fff" stroke="${K}" stroke-width="2"/>`],
body:[
`<ellipse cx="100" cy="120" rx="34" ry="48" ${f}/><ellipse cx="100" cy="128" rx="22" ry="28" fill="#fff" opacity=".55"/><circle cx="100" cy="116" r="8" fill="#ff3b5c" ${O} ${T}/><circle cx="98" cy="114" r="2.5" fill="#fff"/><path d="M92 142h16" ${N} ${T}/>`,
`<path d="M64 72h72l-12 96H76z" ${f}/><rect x="80" y="86" width="40" height="30" rx="6" fill="#fff" ${O} ${T}/><path d="M104 88l-10 14h8l-4 12 14-18h-8z" fill="${Y}" stroke="${K}" stroke-width="2"/><text x="100" y="146" font-size="15" font-weight="800" text-anchor="middle" fill="${K}">BEEP</text>`,
`<rect x="68" y="72" width="64" height="96" rx="24" ${f}/><path d="M68 100h64M68 144h64" stroke="${K}" stroke-width="3"/><circle cx="100" cy="122" r="16" fill="#fff" ${O} ${T}/><text x="100" y="129" font-size="20" text-anchor="middle">🦆</text>`,
`<path d="M80 72h40l14 48-14 48H80L66 120z" ${f}/><rect x="82" y="92" width="36" height="40" rx="8" fill="#12203a" ${O} ${T}/><circle cx="92" cy="108" r="3.5" fill="#7dff6b"/><circle cx="108" cy="108" r="3.5" fill="#7dff6b"/><path d="M91 119q9 9 18 0" stroke="#7dff6b" stroke-width="3" fill="none" stroke-linecap="round"/>`,
`<rect x="70" y="72" width="60" height="96" rx="12" ${f}/><path d="M70 96h60M70 148h60" stroke="${K}" stroke-width="3" stroke-dasharray="6 5"/><path d="M100 100l6 12 13 2-10 9 3 13-12-7-12 7 3-13-10-9 13-2z" fill="${Y}" ${O} ${T}/><rect x="108" y="150" width="18" height="9" rx="2" fill="#ffd9b0" ${O} stroke-width="2" transform="rotate(-20 117 154)"/>`],
armL:[
`<path d="M58 84q-16 28 0 48t0 26" stroke="${K}" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M58 84q-16 28 0 48t0 26" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="58" cy="158" r="11" fill="#fff" ${O}/><path d="M53 156h10" stroke="${K}" stroke-width="2.5"/>`,
`<rect x="50" y="82" width="16" height="58" rx="8" ${f}/><circle cx="58" cy="108" r="6" fill="${Y}" ${O} ${T}/><path d="M44 142h28l-3 12-7 12-3-9-3 9-7-12z" ${f}/>`,
`<path d="M58 84l-8 8 16 8-16 8 16 8-16 8 8 6" ${N} stroke-width="3.5"/><circle cx="58" cy="152" r="15" fill="#ff4d6d" ${O}/><path d="M50 146q2-5 7-5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>`,
`<rect x="50" y="82" width="16" height="48" rx="8" ${f}/><path d="M42 130h32q4 18-6 34l-6-18-6 18q-14-10-14-34z" fill="#ff5a4d" ${O}/>`,
`<circle cx="58" cy="88" r="10" ${f}/><rect x="55" y="96" width="6" height="56" fill="#a0693a" ${O} stroke-width="3"/><path d="M42 166q16-26 32 0z" fill="#ff4d4d" ${O}/>`],
legL:[
`<path d="M86 172l-10 7 20 7-20 7 20 7-20 7 20 7-10 6v14" ${N} stroke-width="3.5"/><path d="M98 236v18H58v-5q0-7 9-7h10l6-6z" fill="#fff" ${O}/><path d="M60 248h38" stroke="#ff4d4d" stroke-width="4"/>`,
`<rect x="76" y="170" width="20" height="56" rx="6" ${f}/><path d="M76 222h20v32H56v-10q0-8 6-8h14z" fill="#8a5a2b" ${O}/><circle cx="88" cy="232" r="2.5" fill="${Y}"/><circle cx="88" cy="241" r="2.5" fill="${Y}"/>`,
`<rect x="80" y="170" width="12" height="54" rx="6" ${f}/><circle cx="86" cy="240" r="17" fill="#2b2b3a" ${O}/><path d="M86 223v34M69 240h34" stroke="#666" stroke-width="2"/><circle cx="86" cy="240" r="7" fill="${c}" stroke="${K}" stroke-width="3"/>`,
`<rect x="76" y="170" width="20" height="54" rx="6" ${f}/><path d="M72 224h28l4 22H66z" fill="#e8e8f5" ${O}/><path d="M72 248l14 22 14-22z" fill="#ff9a1f" ${O} ${T}/><path d="M80 248l6 12 6-12z" fill="${Y}"/>`,
`<rect x="78" y="170" width="16" height="64" rx="8" fill="#ffb02e" ${O}/><path d="M86 234l-24 22q12 6 24 0q12 6 24 0z" fill="#ffc933" ${O}/><path d="M74 254l2-10M86 256v-12" stroke="${K}" stroke-width="2"/>`]};
return S[s==='armR'?'armL':s==='legR'?'legL':s][v];}
function box(s){const[x,y,w,h]=BB[s],cx=x+w/2,cy=y+h/2;
return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#c99a62" stroke="#3a2410" stroke-width="4"/><rect x="${cx-5}" y="${y}" width="10" height="${h}" fill="#e3c590" opacity=".85"/><path d="M${cx-9} ${cy-4}l6 6m0-6l-6 6M${cx+3} ${cy-4}l6 6m0-6l-6 6M${cx-7} ${cy+12}q7-6 14 0" fill="none" stroke="#3a2410" stroke-width="2.5" stroke-linecap="round"/>`;}
const mir=s=>s==='armR'||s==='legR';
const wrap=(s,inner)=>mir(s)?`<g transform="translate(200,0) scale(-1,1)">${inner}</g>`:inner;
// ====== STATE ======
let G,AC,cur,mode='alt',names=['Team A','Team B'],pool=[],busy=false;
const $=id=>document.getElementById(id),app=$('app');
function newGame(){G=[0,1].map(()=>[{}]);cur=0;busy=false;pool=QS.map(q=>q).sort(()=>Math.random()-.5);}
function snd(ok){try{AC=AC||new AudioContext();const t=AC.currentTime;
const n=(f,d,ty,st)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t+st);if(!ok)o.frequency.exponentialRampToValueAtTime(40,t+st+d);g.gain.setValueAtTime(.15,t+st);g.gain.exponentialRampToValueAtTime(.001,t+st+d);o.connect(g);g.connect(AC.destination);o.start(t+st);o.stop(t+st+d);};
if(ok){n(660,.15,'sine',0);n(990,.3,'sine',.12)}else{n(220,.6,'sawtooth',0);n(120,.7,'square',.05)}}catch(e){}}
// ====== SCREENS ======
function setup(){app.innerHTML=`<h1>🤖 ROBOT ASSEMBLY LAB</h1><p class="center mut">Answer correctly to build your robot. Wrong answer = the part explodes and becomes cardboard!</p>
<div class="card" style="max-width:480px;margin:20px auto"><p class="mut">Team 1 name</p><input id="n0" value="Team Cyan"><p class="mut">Team 2 name</p><input id="n1" value="Team Orange">
<p class="mut">Turn order</p><select id="md" style="width:100%;padding:10px;font-family:inherit;background:#0a1226;color:#e6f0ff;border:1px solid #243558;border-radius:8px;font-size:15px"><option value="alt">Alternate (A, B, A, B…)</option><option value="seq">One team builds fully, then the other</option></select><p class="center"><button class="btn" id="go">START ▶</button></p></div>`;
$('go').onclick=()=>{names=[$('n0').value||'Team 1',$('n1').value||'Team 2'];mode=$('md').value;newGame();board();};}
function robot(t,r,ev){const c=COL[t],R=G[t][r];let h=`<svg viewBox="0 0 200 270" data-t="${t}" data-r="${r}"><ellipse cx="100" cy="262" rx="70" ry="7" fill="${c}" opacity=".2"/>`;
['legL','legR','body','armL','armR','head'].forEach(s=>{const v=R[s],e=ev&&ev.t===t&&ev.r===r&&ev.s===s,[x,y,w,hh]=BB[s],act=t===cur&&!busy;
let inner='';
if(!v)inner=`<g class="slot ${act?'act':''}" data-s="${s}"><rect class="gh" x="${x}" y="${y}" width="${w}" height="${hh}" rx="8" stroke="${c}"/><text x="${x+w/2}" y="${y+hh/2}">+</text></g>`;
else if(v.ok)inner=`<g class="${e?'drop':''}">${part(s,v.v,c)}</g>`;
else inner=`<g class="${e?'boxin':''}">${box(s)}</g>`;
h+=wrap(s,inner);
if(e&&!v.ok){const cx=mir(s)?200-x-w/2:x+w/2,cy=y+hh/2;
h+=`<g><circle class="burst" cx="${cx}" cy="${cy}" r="18" fill="#ffb347"/><circle class="burst" cx="${cx}" cy="${cy}" r="10" fill="#ff4d6d"/><circle class="flash" cx="${cx}" cy="${cy}" r="26" fill="#fff" opacity=".7"/><text x="${cx}" y="${cy+8}" font-size="30" text-anchor="middle" class="flash">💥</text></g>`;}});
return h+`</svg>`;}
function sc(t){return G[t].reduce((a,R)=>a+Object.values(R).filter(v=>v.ok).length,0);}
function board(ev){
app.innerHTML=`<div class="hud"><div class="score ${cur===0?'on':''}" style="color:${COL[0]}">${names[0]}<b>${sc(0)}<small style="font-size:12px"> /6</small></b></div>
<div class="score ${cur===1?'on':''}" style="color:${COL[1]}">${names[1]}<b>${sc(1)}<small style="font-size:12px"> /6</small></b></div></div>
<div class="banner">▶ <b style="color:${COL[cur]}">${names[cur]}</b>: click a glowing “+” slot on your robot</div>
<div class="teams">${[cur].map(t=>`<div class="team ${t===cur?'on':''}" style="border-color:${t===cur?COL[t]:''}"><h2 style="color:${COL[t]}">${names[t]}</h2><div class="robots">${[0].map(r=>`<div>${robot(t,r,ev)}<div class="rn">Robot ${t?'B':'A'}</div></div>`).join('')}</div></div>`).join('')}</div>`;
app.querySelectorAll('.slot.act').forEach(g=>g.onclick=()=>{const sv=g.closest('svg');pick(+sv.dataset.t,+sv.dataset.r,g.dataset.s);});}
function modal(html){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="panel" style="border-color:${COL[cur]}">${html}</div>`;document.body.appendChild(o);return o;}
function pick(t,r,s){busy=true;const c=COL[t],[x,y,w,h]=BB[s],p=8;
const o=modal(`<b style="color:${c}">${names[t]}</b> — choose a design for <b>${LB[s]}</b><div class="picks">${NM.map((n,i)=>`<button class="pk" style="--c:${c}" data-i="${i}"><svg viewBox="${x-p} ${y-p} ${w+2*p} ${h+2*p}">${part(s==='armR'?'armL':s==='legR'?'legL':s,i,c)}</svg></button>`).join('')}</div><p class="center"><button class="pk" id="cx" style="padding:8px 18px">Cancel</button></p>`);
o.querySelector('#cx').onclick=()=>{o.remove();busy=false;};
o.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{o.remove();ask(t,r,s,+b.dataset.i);});}
function ask(t,r,s,v){
if(!pool.length)pool=QS.map(q=>q).sort(()=>Math.random()-.5);
const q=pool.pop(),opts=q[1].map((x,i)=>({x,ok:i===0})).sort(()=>Math.random()-.5);
const o=modal(`<div class="mut">❓ QUESTION — ${LB[s]} <b id="tm" style="float:right;font-size:22px;color:#fff">15</b></div><div class="bar"><i id="tb"></i></div><div class="q">${q[0]}</div>${opts.map((p,i)=>`<button class="opt" data-i="${i}">${'ABCD'[i]}. ${p.x}</button>`).join('')}<div id="rs"></div>`);
let done=false,left=15;const iv=setInterval(()=>{left--;const tm=o.querySelector('#tm'),tb=o.querySelector('#tb');if(tm){tm.textContent=left;tb.style.width=left/15*100+'%';if(left<=5){tb.style.background='var(--bad)';tm.style.color='#ff4d6d';}}if(left<=0){clearInterval(iv);go(-1);}},1000);
o.querySelectorAll('.opt').forEach(b=>b.onclick=()=>go(+b.dataset.i));function go(i){if(done)return;done=true;clearInterval(iv);const ok=i>=0&&opts[i].ok;
o.querySelectorAll('.opt').forEach((e,i)=>{if(opts[i].ok)e.classList.add('ok');});if(i>=0&&!ok)o.querySelectorAll('.opt')[i].classList.add('no');
o.querySelector('#rs').innerHTML=ok?`<div class="res" style="color:var(--ok)">✅ Correct! Assembling part…</div>`:`<div class="res" style="color:var(--bad)">💥 ${i<0?'Time’s up!':'Wrong!'} The part will explode…</div>`;
setTimeout(()=>{o.remove();G[t][r][s]={v,ok};snd(ok);board({t,r,s});const nx=(mode==='seq'&&Object.keys(G[t][0]).length<6)?t:1-t;setTimeout(()=>{if(SL.length*2===G.flat().reduce((a,R)=>a+Object.keys(R).length,0))return;cur=nx;busy=false;board();},ok?1800:2400);
if(SL.length*2===G.flat().reduce((a,R)=>a+Object.keys(R).length,0))setTimeout(end,2600);},1500);}}
function end(){const a=sc(0),b=sc(1),w=a===b?'It’s a tie!':`🏆 ${names[a>b?0:1]} wins!`;
modal(`<div class="center"><h1>BUILD COMPLETE</h1><div class="res">Time to fight! ⚔️</div><p class="mut">Each cardboard part = −8 starting HP</p><p>${names[0]}: <b style="color:${COL[0]}">${a}</b> /6 &nbsp;·&nbsp; ${names[1]}: <b style="color:${COL[1]}">${b}</b> /6</p><button class="btn" id="again">⚔️ START BATTLE</button></div>`).querySelector('#again').onclick=lobby;}
const AC5={p:['👊','Punch'],k:['🦶','Kick'],g:['🛡️','High Guard'],j:['🦘','Jump'],s:['⚡','Special']};
const DS={p:'12 dmg · High Guard blocks it',k:'18 dmg · Jump dodges it · every 2 turns',g:'Blocks Punch · every 2 turns',j:'Dodges Kick + counter 15',s:'35 dmg · quiz! · recharge 3 turns'};
let B;
function battle(){document.querySelectorAll('.ov').forEach(e=>e.remove());busy=true;B={hp:[100-8*(6-sc(0)),100-8*(6-sc(1))],cd:[{g:0,k:0,s:0},{g:0,k:0,s:0}],rd:1,pk:[null,null],ch:0,an:['',''],dm:[0,0],em:['',''],msg:'',lock:false,ph:!HOT};bs();sendPicks();}
function bs(){const t=B.ch,L=B.lock;
const hp=i=>`<div class='score' style='color:${COL[i]};border-color:${COL[i]}'>${names[i]}<div class='hp'><i style='width:${B.hp[i]}%;background:${COL[i]}'></i></div><b style='font-size:18px'>${B.hp[i]} HP</b></div>`;
const fig=i=>`<div class='fig f${i} ${B.an[i]}'>${B.dm[i]?`<b class='dmg'>-${B.dm[i]}</b>`:''}${B.em[i]?`<span class='emo'>${B.em[i]}</span>`:''}${robot(i,0,null)}</div>`;
const st=i=>B.pk[i]?'✅ locked in':'🤔 thinking…';const panel=B.ph&&!L?`<div class='center res'>📱 ${names[0]}: ${st(0)}<br>📱 ${names[1]}: ${st(1)}</div>`:L?`<div class='center res'>${B.msg}</div>`:`<p class='center'><b style='color:${COL[t]}'>${names[t]}</b> — pick an action<br><span class='mut'>${t?'✅ '+names[0]+' locked in':'(other team: look away 👀)'}</span></p><div class='acts'>${Object.keys(AC5).map(a=>{const c=B.cd[t][a]||0;return `<button class='act' data-a='${a}' ${c?'disabled':''}><span>${AC5[a][0]}</span><b>${AC5[a][1]}</b><small>${c?'🔒 '+c+' turn'+(c>1?'s':''):DS[a]}</small></button>`}).join('')}</div>`;
app.innerHTML=`<div class='hud'>${hp(0)}${hp(1)}</div><div class='banner'>⚔️ Round ${B.rd}/15</div><div class='arena'>${fig(0)}<div class='vs'>VS</div>${fig(1)}</div>${panel}`;
app.querySelectorAll('.act').forEach(b=>b.onclick=()=>bpick(b.dataset.a));}
function bpick(a){B.pk[B.ch]=a;if(B.ch===0){B.ch=1;bs();}else{B.lock=true;B.msg='⏳ …';bs();bres();}}
function quizq(t,cb){if(!pool.length)pool=QS.map(q=>q).sort(()=>Math.random()-.5);cur=t;
const q=pool.pop(),op=q[1].map((x,i)=>({x,ok:i===0})).sort(()=>Math.random()-.5);
const o=modal(`<div class='mut'>⚡ SPECIAL ATTACK — <b style='color:${COL[t]}'>${names[t]}</b> <b id='tm' style='float:right;font-size:22px;color:#fff'>15</b></div><div class='bar'><i id='tb'></i></div><div class='q'>${q[0]}</div>${op.map((p,i)=>`<button class='opt' data-i='${i}'>${'ABCD'[i]}. ${p.x}</button>`).join('')}<div id='rs'></div>`);
let dn=0,left=15;const iv=setInterval(()=>{left--;const tm=o.querySelector('#tm'),tb=o.querySelector('#tb');tm.textContent=left;tb.style.width=left/15*100+'%';if(left<=5){tb.style.background='var(--bad)';tm.style.color='#ff4d6d';}if(left<=0)go(-1);},1000);
function go(i){if(dn)return;dn=1;clearInterval(iv);const ok=i>=0&&op[i].ok,E=o.querySelectorAll('.opt');E.forEach((e,k)=>{if(op[k].ok)e.classList.add('ok')});if(i>=0&&!ok)E[i].classList.add('no');
o.querySelector('#rs').innerHTML=ok?`<div class='res' style='color:var(--ok)'>✅ Special charged!</div>`:`<div class='res' style='color:var(--bad)'>${i<0?'⏰ Time’s up!':'❌ Wrong!'} Special failed…</div>`;
if(B.ph)tx(t,{k:'msg',text:ok?'✅ Special charged!':'❌ Special failed…'});QZ=null;setTimeout(()=>{o.remove();cb(ok)},1400);}
QZ={t,go};if(B.ph){tx(t,{k:'quiz',q:q[0],opts:op.map(p=>p.x),sec:15});tx(1-t,{k:'msg',text:'⚡ Opponent is casting a Special…'});}o.querySelectorAll('.opt').forEach(b=>b.onclick=()=>go(+b.dataset.i));}
function bres(){const sp=[0,0],go=t=>{if(t>1)return fin();if(B.pk[t]==='s')quizq(t,ok=>{sp[t]=ok;go(t+1)});else go(t+1)};
const fin=()=>{const[x,y]=B.pk,d=[0,0],ev=[],an=['',''];
[0,1].forEach(i=>{const a=B.pk[i],o=B.pk[1-i],n=names[i],m=names[1-i];
if(a==='p'){an[i]='atk';if(o==='g')ev.push(`🛡️ ${m} blocked the punch!`);else d[1-i]+=12}
else if(a==='k'){an[i]='atk';if(o==='j')ev.push(`🦘 ${m} dodged the kick!`);else d[1-i]+=18}
else if(a==='g')an[i]='gd';
else if(a==='j'){an[i]='jmp';if(o==='k'){d[1-i]+=15;ev.push(`🦘 ${n} counter-attacks!`)}}
else if(a==='s'){if(sp[i]){an[i]='atk sp';d[1-i]+=35;ev.push(`⚡ ${n}’s SPECIAL lands!`)}else{an[i]='fail';ev.push(`💨 ${n}’s special FAILED!`)}}});
B.hp=B.hp.map((h,i)=>Math.max(0,h-d[i]));B.dm=d;d.forEach((v,i)=>{if(v)an[i]+=' hurt'});B.an=an;
B.em=B.pk.map((a,i)=>a==='s'&&!sp[i]?'💨':AC5[a][0]);
B.msg=`<div style='font-size:26px'>${names[0]} ${AC5[x][0]} <span class='mut'>vs</span> ${AC5[y][0]} ${names[1]}</div><div>${ev.join(' · ')||'Nothing happens…'}</div>`;
['g','k','s'].forEach(k=>[0,1].forEach(i=>{if(B.cd[i][k]>0)B.cd[i][k]--}));
[0,1].forEach(i=>{const a=B.pk[i];if(a==='g'||a==='k')B.cd[i][a]=1;if(a==='s')B.cd[i].s=3});
if(B.ph)tx('all',{k:'msg',text:AC5[x][0]+' vs '+AC5[y][0]+' — '+(ev.join(' · ')||'Nothing happens…'),hp:B.hp});
bs();
setTimeout(()=>{if(B.hp[0]<=0||B.hp[1]<=0||B.rd>=15)return bend();B.rd++;B.pk=[null,null];B.ch=0;B.an=['',''];B.dm=[0,0];B.em=['',''];B.lock=false;B.msg='';bs();sendPicks();},3400);};
go(0);}
function bend(){if(B.ph)tx('all',{k:'msg',text:B.hp[0]===B.hp[1]?'🤝 Draw!':'🏆 '+names[B.hp[0]>B.hp[1]?0:1]+' wins!'});const[a,b]=B.hp,w=a===b?'It’s a draw! 🤝':`🏆 ${names[a>b?0:1]} wins the battle!`;
modal(`<div class='center'><h1>${a<=0||b<=0?'K.O.! 💥':'TIME!'}</h1><div class='res'>${w}</div><p>${names[0]}: ${a} HP · ${names[1]}: ${b} HP</p><button class='btn' id='again'>PLAY AGAIN</button></div>`).querySelector('#again').onclick=()=>{document.querySelectorAll('.ov').forEach(e=>e.remove());B=null;HOT=false;hello();setup();};}

let HOT=false,PL=[0,0],ws,lob=0,QZ=null;
function tx(team,msg){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'to',team,msg}));}
function hello(){[0,1].forEach(t=>tx(t,{k:'hello',name:names[t],col:COL[t]}));}
function sendPicks(){if(!B.ph)return;[0,1].forEach(t=>tx(t,{k:'pick',name:names[t],col:COL[t],rd:B.rd,hp:B.hp,acts:Object.keys(AC5).map(a=>({a,i:AC5[a][0],n:AC5[a][1],d:DS[a],c:B.cd[t][a]||0}))}));}
function phAct(t,a){if(!B||!B.ph||B.lock||B.pk[t]||!AC5[a]||(B.cd[t][a]||0)>0)return;B.pk[t]=a;tx(t,{k:'locked'});if(B.pk[0]&&B.pk[1]){B.lock=true;B.msg='⏳ …';bs();bres();}else bs();}
function lobby(){document.querySelectorAll('.ov').forEach(e=>e.remove());lob=1;
const u=t=>location.origin+'/c.html?t='+t;
const box=t=>`<div class='card center' style='border-color:${COL[t]}'><h2 style='color:${COL[t]}'>${names[t]}</h2><img width='170' height='170' style='background:#fff;padding:6px;border-radius:8px' src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(u(t))}' alt=''><p class='mut' style='word-break:break-all'>${u(t)}</p><div class='res' style='color:${PL[t]?'var(--ok)':'var(--mut)'}'>${PL[t]?'📱 Connected':'⏳ Waiting…'}</div></div>`;
app.innerHTML=`<h1>📱 CONNECT PHONES</h1><p class='center mut'>Each team scans their own QR code to control their robot</p><div style='display:grid;grid-template-columns:1fr 1fr;gap:12px'>${box(0)}${box(1)}</div><p class='center'><button class='btn' id='fg' ${PL[0]&&PL[1]?'':"disabled style='opacity:.4'"}>⚔️ FIGHT!</button></p><p class='center'><button class='pk' id='ht' style='padding:8px 16px'>Skip phones (hotseat)</button></p>`;
$('fg').onclick=()=>{lob=0;HOT=false;battle();};$('ht').onclick=()=>{lob=0;HOT=true;battle();};}
function conn(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
ws.onopen=()=>ws.send(JSON.stringify({type:'host'}));
ws.onclose=()=>{PL=[0,0];setTimeout(conn,1500);};
ws.onmessage=e=>{const m=JSON.parse(e.data);
if(m.type==='players'){PL=m.on;if(lob)lobby();if(!B)hello();}
else if(m.type==='c'&&B){if(m.msg.k==='act')phAct(m.team,m.msg.a);if(m.msg.k==='ans'&&QZ&&QZ.t===m.team)QZ.go(m.msg.i);}};}
conn();
setup();
</script></body></html>
